version: '3.8'

services:
  # =============================================================================
  # 1. CƠ SỞ DỮ LIỆU CHÍNH (POSTGRESQL 15+)
  # =============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: bsp_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bank_statement_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bank_statement_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bsp_network

  # =============================================================================
  # 2. HÀNG ĐỢI & CACHE (REDIS 7.0+)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: bsp_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_password_2026}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bsp_network

  # =============================================================================
  # 3. KHO LƯU TRỮ OBJECT STORAGE NỘI BỘ (MINIO)
  # =============================================================================
  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: bsp_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bsp_network

  createbuckets:
    image: minio/mc:RELEASE.2023-09-29T21-46-24Z
    container_name: bsp_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minio_admin} ${MINIO_ROOT_PASSWORD:-minio_secure_password_2026};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-statements} --ignore-existing;
      /usr/bin/mc anonymous set none myminio/${MINIO_BUCKET_NAME:-statements};
      echo 'MinIO Bucket statements initialized successfully!';
      exit 0;
      "
    networks:
      - bsp_network

  # =============================================================================
  # 4. BACKEND API GATEWAY & INGESTION SERVICE (FASTAPI)
  # =============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsp_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bank_statement_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_dev_password_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password_2026}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_password_2026}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-statements}
      - MINIO_USE_SSL=False
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bsp_super_secret_jwt_key_development_must_be_changed_in_prod_2026}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - bsp_network

  # =============================================================================
  # 5. ASYNC BACKGROUND WORKER (CELERY)
  # =============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsp_worker
    restart: always
    command: celery -A workers.celery_app.celery worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=development
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-bank_statement_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres_dev_password_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_password_2026}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_password_2026}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-statements}
      - MINIO_USE_SSL=False
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bsp_network

  # =============================================================================
  # 6. FRONTEND SINGLE PAGE APPLICATION (REACT 18+ / VITE)
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bsp_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bsp_network

networks:
  bsp_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

