        - rule_name
        - category_id
        - keyword_patterns
      properties:
        rule_name:
          type: string
          example: "Quy tắc Chi NCC Thép Hòa Phát"
        category_id:
          type: integer
          example: 3
        priority:
          type: integer
          default: 10
        keyword_patterns:
          type: string
          example: "thep hoa phat, hoa phat, hp steel"
        match_type:
          type: string
          enum: [CONTAINS, EXACT, REGEX]
          default: "CONTAINS"
        target_bank_code:
          type: string
          nullable: true
          example: "VCB"
        target_account_number:
          type: string
          nullable: true
        min_amount:
          type: number
          nullable: true
          example: 10000000.00
        max_amount:
          type: number
          nullable: true
        applies_to_flow:
          type: string
          enum: [ALL, CREDIT, DEBIT]
          default: "DEBIT"

    ReapplyRulesResponse:
      type: object
      properties:
        total_processed:
          type: integer
          description: Tổng số lượng dòng giao dịch đã quét
          example: 3500
        tagged_count:
          type: integer
          description: Số dòng giao dịch được gán hoặc đổi danh mục tự động
          example: 280
        skipped_manual_override_count:
          type: integer
          description: Số dòng giao dịch được bảo vệ tuyệt đối không ghi đè do có cờ is_manual_override = true
          example: 45
        message:
          type: string
          example: "Đã áp dụng quy tắc thành công. 45 dòng phân loại thủ công được bảo toàn nguyên vẹn."

    CfoLiquidityResponse:
      type: object
      properties:
        report_date:
          type: string
          format: date
          example: "2026-10-30"
        total_consolidated_liquidity:
          type: number
          description: Tổng tiền tồn quỹ hợp nhất (DECIMAL 18,2) = Tổng ngân hàng + Tổng tồn quỹ tiền mặt
          example: 125450000000.00
        total_bank_balance:
          type: number
          example: 120250000000.00
        total_cash_on_hand:
          type: number
          example: 5200000000.00
        bank_breakdown:
          type: array
          items:
            type: object
            properties:
              bank_code:
                type: string
                example: "MBB"
              bank_name:
                type: string
                example: "Ngân hàng TMCP Quân Đội"
              account_number:
                type: string
                example: "111386888"
              account_holder:
                type: string
                example: "CONG TY CO PHAN XI MANG SUNRISE"
              balance:
                type: number
                example: 147097279.00

    WaterfallReportResponse:
      type: object
      properties:
        timeframe:
          type: string
          enum: [WTD, MTD]
          example: "MTD"
        opening_balance:
          type: number
          example: 110000000000.00
        income_components:
          type: array
          items:
            type: object
            properties:
              category_name:
                type: string
                example: "Thu bán hàng & Đối tác"
              amount:
                type: number
                example: 65000000000.00
        expense_components:
          type: array
          items:
            type: object
            properties:
              category_name:
                type: string
                example: "Chi Nhà cung cấp"
              amount:
                type: number
                example: 32000000000.00
        steps:
          type: array
          description: Mảng tuần tự các cột render trực tiếp lên biểu đồ Waterfall của CEO
          items:
            type: object
            properties:
              name:
                type: string
                example: "Số dư Đầu kỳ"
              type:
                type: string
                enum: [OPENING, INCOME, EXPENSE, CLOSING]
                example: "OPENING"
              value:
                type: number
