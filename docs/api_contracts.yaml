          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateInfoItem'

  # ===========================================================================
  # 9. NHẬT KÝ KIỂM TOÁN AN NINH (AUDIT LOGS)
  # ===========================================================================
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Truy vấn nhật ký kiểm toán hệ thống bất biến (Audit Trail)
      operationId: listAuditLogs
      parameters:
        - name: correlation_id
          in: query
          schema:
            type: string
            format: uuid
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            example: "MANUAL_TAG"
        - name: target_entity
          in: query
          schema:
            type: string
            example: "TRANSACTION"
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách bản ghi kiểm toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /credit-statements/upload:
    post:
      summary: Upload và xử lý file sao kê tín dụng / danh sách khoản vay
      description: >
        Tiếp nhận file .xlsx hoặc .xls (BIFF8 OLE2), kiểm tra Magic Bytes, mã băm SHA-256 chống trùng lặp,
        bóc tách danh sách khế ước/hợp đồng vay, đối soát tổng dư nợ tự động và cập nhật danh mục khoản vay.
      tags:
        - Credit Statements & Loans
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel sao kê tín dụng (.xlsx hoặc .xls, dung lượng tối đa 25MB)
                uploaded_by:
                  type: string
                  default: "Chị Cẩm Nhung"
                  description: Danh tính người tải lên
      responses:
        '201':
          description: Upload và bóc tách sao kê tín dụng thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditUploadResponse'
        '400':
          description: Dung lượng file vượt quá giới hạn 25MB hoặc Magic Bytes không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: File bị trùng lặp mã băm SHA-256 đã tải lên trước đó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Không nhận diện được mẫu sao kê hoặc dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi máy chủ nội bộ trong quá trình bóc tách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /credit-statements:
    get:
      summary: Lấy danh sách các file sao kê tín dụng đã upload (phân trang)
      tags:
        - Credit Statements & Loans
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Danh sách file sao kê tín dụng kèm thông tin phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditStatementFileItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /credit-statements/{file_id}:
    get:
      summary: Lấy chi tiết file sao kê tín dụng kèm danh sách từng khoản vay đã bóc tách
      tags:
        - Credit Statements & Loans
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Thông tin chi tiết file và danh sách khoản vay bóc tách
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditStatementFileDetail'
        '404':
          description: Không tìm thấy file sao kê tín dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Xóa file sao kê tín dụng và các dòng chi tiết liên quan
      tags:
        - Credit Statements & Loans
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đã xóa thành công file sao kê tín dụng ID #201."
        '404':
          description: Không tìm thấy file sao kê tín dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans:
    get:
      summary: Lấy danh sách các khoản vay và khế ước LD hiện hành (phân trang & lọc đa chiều)
      tags:
        - Credit Statements & Loans
      parameters:
        - name: bank_code
          in: query
          schema:
            type: string
          description: Lọc theo mã ngân hàng hoặc tổ chức tín dụng (CTG, MBB, FE_CREDIT, CHAILEASE...)
        - name: institution_type
          in: query
          schema:
            type: string
            enum: ["BANK", "FINANCE_COMPANY", "LEASING_COMPANY", "OTHER"]
          description: Lọc theo loại hình tổ chức (Ngân hàng, Cty Tài chính, Cho thuê tài chính)
        - name: is_manual
          in: query
          schema:
            type: boolean
          description: Lọc theo nguồn gốc (true = Nhập lẻ thủ công, false = Bóc tách từ file sao kê)
        - name: debt_group
          in: query
          schema:
            type: string
          description: Lọc theo nhóm nợ (1, 2, 3...)
        - name: status_filter
          in: query
          schema:
            type: string
            default: "ACTIVE"
          description: Lọc theo trạng thái (ACTIVE, SETTLED, OVERDUE)
        - name: search
          in: query
          schema:
            type: string
          description: Tìm kiếm theo số khế ước, mục đích vay hoặc tên đơn vị vay
        - name: due_within_days
          in: query
          schema:
            type: integer
          description: Lọc các khoản vay có ngày trả nợ tiếp theo trong vòng N ngày
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Danh sách khoản vay hiện hành kèm thông tin phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreditFacilityItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Tạo mới khoản nợ / khoản vay lẻ ngoài sao kê tự động (Manual Loan Entry)
      tags:
        - Credit Statements & Loans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditFacilityCreate'
      responses:
        '201':
          description: Tạo mới khoản vay lẻ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditFacilityItem'
        '409':
          description: Trùng lặp số hợp đồng tại cùng đơn vị cấp tín dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

