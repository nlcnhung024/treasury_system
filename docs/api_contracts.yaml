            type: boolean
      responses:
        '200':
          description: Danh sách quy tắc phân loại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleItem'
    post:
      tags:
        - Rule Management
      summary: Tạo mới quy tắc nhận diện từ khóa kết hợp điều kiện nâng cao
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRulePayload'
      responses:
        '201':
          description: Tạo quy tắc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleItem'

  /rules/{rule_id}:
    patch:
      tags:
        - Rule Management
      summary: Cập nhật quy tắc phân loại từ khóa nâng cao
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_name:
                  type: string
                category_id:
                  type: integer
                priority:
                  type: integer
                keyword_patterns:
                  type: string
                match_type:
                  type: string
                  enum: [CONTAINS, EXACT, REGEX]
                target_bank_code:
                  type: string
