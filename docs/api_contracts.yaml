      tags:
        - Credit Statements & Loans
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã xóa hoặc tất toán thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đã xóa thành công khoản vay ID #1."
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/summary:
    get:
      summary: Lấy tổng hợp KPI dư nợ tín dụng, nghĩa vụ nợ đến hạn và cơ cấu theo ngân hàng
      tags:
        - Credit Statements & Loans
      responses:
        '200':
          description: Tổng hợp KPI dư nợ tín dụng phục vụ CFO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditFacilitySummary'

  /loans/organizations:
    get:
      summary: Lấy danh sách các đơn vị cấp tín dụng / ngân hàng / công ty tài chính đã từng có khoản vay
      tags:
        - Credit Statements & Loans
      responses:
        '200':
          description: Danh sách đơn vị cấp tín dụng đã lưu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditOrganizationItem'

  /loans/{loan_id}/dossier/upload:
    post:
      summary: Tải lên tài liệu hồ sơ giải ngân khoản vay lưu trữ tại Object Storage
      tags:
        - Credit Statements & Loans
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
          description: ID khoản vay gắn hồ sơ giải ngân
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File tài liệu (PDF, Word, Excel, hình ảnh) tối đa 50MB
                document_type:
                  type: string
                  enum: ["CONTRACT", "DEBT_NOTE", "DISBURSEMENT_RECORD", "DISBURSEMENT_NOTE", "INVOICE", "COLLATERAL", "APPROVAL", "OTHER"]
                  default: "OTHER"
                  description: Phân loại tài liệu trong hồ sơ giải ngân
                description:
                  type: string
                  description: Diễn giải ghi chú chi tiết về tài liệu
      responses:
        '201':
          description: Tải lên và lưu trữ tài liệu vào Object Storage thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementDocumentUploadResponse'
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/{loan_id}/dossier:
    get:
      summary: Lấy danh sách toàn bộ hồ sơ giải ngân gắn với khoản vay
      tags:
        - Credit Statements & Loans
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
          description: ID khoản vay cần xem hồ sơ
      responses:
        '200':
          description: Danh sách tài liệu trong bộ hồ sơ giải ngân
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DisbursementDocumentItem'
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/{loan_id}/invoices/reconciliation:
    get:
      summary: Đối soát tổng giá trị hóa đơn điện tử XML với dư nợ gốc của khoản vay
      description: Bóc tách và tính tổng số tiền thanh toán của các hóa đơn XML (theo NĐ 123/TT 78). Cảnh báo thiếu hóa đơn nếu tổng tiền hóa đơn bé hơn dư nợ gốc.
      tags:
        - Credit Statements & Loans
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
          description: ID khoản vay cần đối soát hóa đơn
      responses:
        '200':
          description: Kết quả đối soát hóa đơn giải ngân
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanInvoiceReconciliationResponse'
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/dossier/{document_id}/download:
    get:
      summary: Tải xuống tài liệu hồ sơ giải ngân từ Object Storage
      tags:
        - Credit Statements & Loans
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
          description: ID tài liệu cần tải xuống
      responses:
        '200':
          description: Tải file thành công dạng stream nhị phân
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Không tìm thấy tài liệu hoặc file trên Object Storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/dossier/{document_id}:
    delete:
      summary: Xóa tài liệu khỏi bộ hồ sơ giải ngân
      tags:
        - Credit Statements & Loans
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: integer
          description: ID tài liệu cần xóa
      responses:
        '200':
          description: Xóa tài liệu thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Đã xóa tài liệu khỏi hồ sơ giải ngân."
        '404':
          description: Không tìm thấy tài liệu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/repayment-reconciliations/unreconciled:
    get:
      summary: Lấy danh sách giao dịch chi trả nợ chờ đối soát kèm gợi ý khế ước
      tags:
        - Debt Repayment Reconciliation
      parameters:
        - name: bank_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc theo mã ngân hàng (CTG, MBB...)
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: Lọc theo từ khóa khế ước hoặc diễn giải
      responses:
        '200':
          description: Danh sách giao dịch trả nợ chưa đối soát
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnreconciledDebtTransactionItem'
                  total_count:
                    type: integer
                  total_unreconciled_amount:
                    type: number
                    format: decimal

  /loans/repayment-reconciliations/reconcile:
    post:
      summary: Đối soát giao dịch trả nợ, chia gốc - lãi và giảm trừ nợ gốc
      tags:
        - Debt Repayment Reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentReconcileRequest'
      responses:
        '200':
          description: Đối soát thành công, nợ gốc đã được giảm trừ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepaymentReconcileResponse'
        '400':
          description: Lỗi kiểm tra tính hợp lệ (Gốc + Lãi không bằng tổng giao dịch, hoặc trả vượt dư nợ)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /loans/repayment-reconciliations/{repayment_id}/rollback:
    post:
      summary: Hủy đối soát và hoàn trả dư nợ gốc ban đầu
      tags:
        - Debt Repayment Reconciliation
      parameters:
        - name: repayment_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Hoàn tác thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  restored_balance:
                    type: number
                    format: decimal

  /loans/contract-details:
    get:
      summary: Danh sách chi tiết khế ước (gốc/lãi đã trả từ đối soát, lãi ước tính)
      description: "estimated_interest = original_principal_balance × interest_rate/100 × (maturity_date − disbursement_date) / 365"
      tags:
        - Debt Repayment Reconciliation
      responses:
        '200':
          description: Danh sách khế ước
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        loan_id: { type: integer }
                        bank_code: { type: string }
                        bank_name: { type: string }
                        contract_number: { type: string }
                        original_principal_balance: { type: string, format: decimal }
                        total_principal_paid: { type: string, format: decimal }
                        current_principal_balance: { type: string, format: decimal }
                        interest_rate: { type: string, format: decimal }
                        estimated_interest: { type: string, format: decimal }
                        total_interest_paid: { type: string, format: decimal }
                        disbursement_date: { type: string, format: date, nullable: true }
                        maturity_date: { type: string, format: date, nullable: true }
                        repayment_count: { type: integer }
                        status: { type: string }
  /loans/{loan_id}/cashflow:
    get:
      summary: Bảng dòng tiền trả gốc/lãi của một khế ước
      tags:
        - Debt Repayment Reconciliation
      parameters:
        - name: loan_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Dòng tiền dựng lại theo thứ tự thời gian: opening_principal(1) = original_principal_balance; remaining = opening − principal_amount. is_overdue = trả gốc sau maturity_date"
          content:
            application/json:
              schema:
                type: object
                properties:
                  loan_id: { type: integer }
                  contract_number: { type: string }
                  bank_name: { type: string }
                  maturity_date: { type: string, format: date, nullable: true }
                  original_principal_balance: { type: string, format: decimal }
                  computed_remaining_principal: { type: string, format: decimal }
                  stored_current_principal_balance: { type: string, format: decimal }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        repayment_id: { type: integer }
                        repayment_date: { type: string, format: date-time }
                        description: { type: string, nullable: true, description: "bank_transactions.description" }
                        opening_principal: { type: string, format: decimal }
                        total_amount: { type: string, format: decimal }
                        principal_amount: { type: string, format: decimal }
                        interest_amount: { type: string, format: decimal }
                        remaining_principal: { type: string, format: decimal }
                        is_overdue: { type: boolean }
                        is_over_repaid: { type: boolean, description: "remaining_principal < 0 (tổng gốc trả vượt dư nợ gốc)" }
        '404':
          description: Không tìm thấy khế ước
  /loans/repayment-reconciliations/history:
    get:
      summary: Lấy danh sách lịch sử đối soát trả nợ
      tags:
        - Debt Repayment Reconciliation
      parameters:
        - name: loan_id
          in: query
          required: false
          schema:
            type: integer
        - name: bank_code
          in: query
          required: false
          schema:
            type: string
        - name: keyword
          in: query
          required: false
          description: "Tìm kiếm theo số khế ước, diễn giải sao kê, số ref hoặc ghi chú"
          schema:
            type: string
      responses:
        '200':
          description: Danh sách lịch sử trả nợ
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoanRepaymentHistoryItem'
                  total_count:
                    type: integer

# =============================================================================
# THÀNH PHẦN TÁI SỬ DỤNG (COMPONENTS & SCHEMAS)
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JSON Web Token (JWT) được cấp sau khi đăng nhập thành công.

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key bảo mật dùng riêng cho Background Worker và giao tiếp giữa các vi dịch vụ nội bộ.

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "nhung.nghiem@enterprise.internal"
        password:
          type: string
          format: password
          example: "P@ssw0rdSecure2026!"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 900
          description: Thời hạn hiệu lực của Access Token (15 phút)
        refresh_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 101
        username:
          type: string
          example: "nhung.nghiem"
        full_name:
          type: string
          example: "Nghiêm Lê Cẩm Nhung"
        role:
          type: string
          enum: [ACCOUNTANT, CFO, CEO, SYSTEM_ADMIN]
          example: "ACCOUNTANT"
        allowed_tax_codes:
          type: array
          items:
            type: string
          example: ["0109730501", "0109888999"]
          description: Danh sách Mã số thuế Pháp nhân mà người dùng được phân quyền truy cập

    BankAccountItem:
      type: object
      properties:
        account_id:
          type: integer
          example: 1
        bank_code:
          type: string
          example: "MBB"
        bank_name:
          type: string
          example: "Ngân hàng TMCP Quân Đội"
        account_number:
          type: string
          example: "111386888"
        account_holder:
          type: string
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        tax_code:
          type: string
          example: "0109730501"
        account_type:
          type: string
          enum: [CORPORATE, SPECIAL_CASH]
          example: "CORPORATE"
        currency:
          type: string
          example: "VND"
        opening_balance:
          type: number
          example: 0.00
        current_balance:
          type: number
          example: 147097279.00
        is_active:
          type: boolean
          example: true

    CreateAccountPayload:
      type: object
      required:
        - bank_code
        - bank_name
        - account_number
        - account_holder
      properties:
        bank_code:
          type: string
          example: "MBB"
        bank_name:
          type: string
          example: "Ngân hàng TMCP Quân Đội"
        account_number:
          type: string
          example: "111386888"
        account_holder:
          type: string
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        tax_code:
          type: string
          example: "0109730501"
        account_type:
          type: string
          enum: [CORPORATE, SPECIAL_CASH]
          default: "CORPORATE"
        currency:
          type: string
          default: "VND"
        opening_balance:
          type: number
          default: 0.00

    StatementFileItem:
      type: object
      properties:
        file_id:
          type: integer
          example: 1045
        file_uuid:
          type: string
          format: uuid
        bank_code:
          type: string
          example: "MBB"
        account_number:
          type: string
          example: "111386888"
        original_filename:
          type: string
          example: "Bang ket qua giao dich - 111386888 (2).xlsx"
        file_size_bytes:
          type: integer
          example: 184520
        statement_period_start:
          type: string
          format: date
          example: "2026-10-01"
        statement_period_end:
          type: string
          format: date
          example: "2026-10-29"
        total_transactions_count:
          type: integer
          example: 125
        processing_status:
          type: string
          enum: [UPLOADED, QUEUED, PARSING, RECONCILING, COMPLETED, FAILED]
          example: "COMPLETED"
        reconciliation_status:
          type: string
          enum: [PENDING, BALANCED, DISCREPANCY]
          example: "BALANCED"
        discrepancy_amount:
          type: number
          example: 0.00
        uploaded_by:
          type: string
          example: "Nghiêm Lê Cẩm Nhung"
        created_at:
          type: string
          format: date-time
          example: "2026-10-30T08:30:00+07:00"

    StatementFileDetail:
      allOf:
        - $ref: '#/components/schemas/StatementFileItem'
        - type: object
          properties:
            template_code:
              type: string
              example: "MBB_CORP_XLSX"
            reconciliation_mode:
              type: string
              example: "MODE_1_FULL_HEADER_FOOTER"
            header_opening_balance:
              type: number
              example: 54200000.00
            header_closing_balance:
              type: number
              example: 147097279.00
            calculated_closing_balance:
              type: number
              example: 147097279.00
            total_credit_amount:
              type: number
              example: 125000000.00
            total_debit_amount:
              type: number
              example: 32102721.00
            storage_path:
              type: string
              example: "/statements/MBB/2026/10/3fa85f64_Bang_ket_qua_giao_dich.xlsx"
            file_sha256:
              type: string
              example: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
            error_message:
              type: string
              nullable: true

    StatementStatusResponse:
      type: object
      properties:
        file_id:
          type: integer
          example: 1045
        template_code:
          type: string
          example: "MBB_CORP_XLSX"
        reconciliation_mode:
          type: string
          enum:
            - MODE_1_FULL_HEADER_FOOTER
            - MODE_2_INFERRED_OPENING_CLOSING
            - MODE_3_DERIVED_RUNNING_BALANCE
            - MODE_4_TOTAL_FLOW_ONLY
            - MODE_5_CUTOFF_INTEREST_INCLUDED
          example: "MODE_1_FULL_HEADER_FOOTER"
        processing_status:
          type: string
          enum: [UPLOADED, QUEUED, PARSING, RECONCILING, COMPLETED, FAILED]
          example: "COMPLETED"
        reconciliation_status:
          type: string
          enum: [PENDING, BALANCED, DISCREPANCY]
          example: "BALANCED"
        total_transactions:
          type: integer
          example: 125
        discrepancy_amount:
          type: number
          description: Số tiền chênh lệch đối soát chính xác (DECIMAL 18,2)
          example: 0.00
        error_message:
          type: string
          nullable: true

    TransactionItem:
      type: object
      properties:
        transaction_id:
          type: integer
          example: 8945
        file_id:
          type: integer
          example: 1045
        account_id:
          type: integer
          example: 1
        bank_code:
          type: string
          example: "VCB"
        account_number:
          type: string
          example: "0071000123456"
        account_holder:
          type: string
          example: "CONG TY TNHH THEP HOANG GIA"
        tax_code:
          type: string
          example: "0109730501"
        transaction_date:
          type: string
          format: date-time
          example: "2026-10-29T08:15:30+07:00"
        value_date:
          type: string
          format: date
          nullable: true
          example: "2026-10-29"
        reference_number:
          type: string
          nullable: true
          example: "FT26302888910"
        counter_party:
          type: string
          nullable: true
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        description:
          type: string
          example: "CTY TNHH TM THEP HOAP PHAT TT TIEN HANG HD 1102"
        debit_amount:
          type: number
          example: 250000000.00
        credit_amount:
          type: number
          example: 0.00
        running_balance:
          type: number
          example: 45200000000.00
        category_id:
          type: integer
          nullable: true
          example: 3
        category_name:
          type: string
          nullable: true
          example: "Chi Nhà cung cấp Thép"
        category_type:
          type: string
          nullable: true
          enum: [INCOME, EXPENSE]
          example: "EXPENSE"
        internal_note:
          type: string
          nullable: true
          example: "Hóa đơn số 00459 - Chị Lan Anh duyệt miệng"
        is_manual_override:
          type: boolean
          example: true
        applied_rule_id:
          type: integer
          nullable: true
          example: 5
        dedup_hash:
          type: string
          example: "a89c74f51bc79a29384759283749827394872938472938472938472938472938"

    BulkTagPayload:
      type: object
      required:
        - transaction_ids
        - category_id
      properties:
        transaction_ids:
          type: array
          items:
            type: integer
          example: [101, 102, 105, 110]
        category_id:
          type: integer
          example: 5

    BulkTagResponse:
      type: object
      properties:
        updated_count:
          type: integer
          example: 4
        message:
          type: string
          example: "Đã gán nhãn thành công 4 giao dịch và kích hoạt khóa bảo vệ chống ghi đè."

    CashLedgerItem:
      type: object
      properties:
        cash_entry_id:
          type: integer
          example: 42
        linked_transaction_id:
          type: integer
          nullable: true
          example: 8945
        entry_date:
          type: string
          format: date
          example: "2026-10-29"
        entry_type:
          type: string
          enum: [INFLOW, OUTFLOW]
          example: "INFLOW"
        amount:
          type: number
          example: 50000000.00
        running_cash_balance:
          type: number
          example: 5200000000.00
        receiver_payer:
          type: string
          example: "Nguyễn Thị Lan Anh"
        reason:
          type: string
          example: "Rút tiền mặt từ tài khoản MBBank cá nhân nhập quỹ phục vụ chi lương thời vụ"
        internal_note:
          type: string
          nullable: true
          example: "Đã ký phiếu thu số PT-2026-10-098"
        created_at:
          type: string
          format: date-time
          example: "2026-10-29T10:00:00+07:00"

    CreateCashEntryPayload:
      type: object
      required:
        - entry_date
        - entry_type
        - amount
        - reason
      properties:
        entry_date:
          type: string
          format: date
          example: "2026-10-29"
        entry_type:
          type: string
          enum: [INFLOW, OUTFLOW]
          example: "INFLOW"
        amount:
          type: number
          example: 50000000.00
        linked_transaction_id:
          type: integer
          nullable: true
          example: 8945
        receiver_payer:
          type: string
          example: "Nguyễn Thị Lan Anh"
        reason:
