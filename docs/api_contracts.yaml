                target_account_number:
                  type: string
                  nullable: true
                min_amount:
                  type: number
                  nullable: true
                max_amount:
                  type: number
                  nullable: true
                applies_to_flow:
                  type: string
                  enum: [ALL, CREDIT, DEBIT]
                is_active:
                  type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleItem'
    delete:
      tags:
        - Rule Management
      summary: Xóa một quy tắc
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã xóa quy tắc thành công

  /rules/re-apply:
    post:
      tags:
        - Rule Management
      summary: Chạy lại toàn bộ bộ quy tắc lên dữ liệu lịch sử (Bảo vệ tuyệt đối dòng is_manual_override = true)
      operationId: reapplyRules
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
