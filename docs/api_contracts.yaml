                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
                bank_code:
                  type: string
      responses:
        '200':
          description: Kết quả chạy lại quy tắc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReapplyRulesResponse'

  # ===========================================================================
  # 7. PHÂN HỆ BÁO CÁO (CFO, CEO & AN TOÀN XUẤT EXCEL)
  # ===========================================================================
  /reports/cfo/daily-liquidity:
    get:
      tags:
        - Reports
      summary: Báo cáo CFO (Ông Trần Ngọc Tuấn) - Tồn quỹ hợp nhất & biến động dòng tiền đa kỳ (< 9h00 sáng)
      operationId: getCfoDailyLiquidity
      parameters:
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [TODAY, YESTERDAY, WTD, MTD, ALL, CUSTOM]
            default: MTD
          description: Kỳ phân tích tồn quỹ (Ngày mới nhất, Hôm trước, Lũy kế Tuần, Lũy kế Tháng, Toàn kỳ, Tùy chọn)
        - name: from_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: exclude_internal_transfers
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Loại trừ luân chuyển nội bộ trên chỉ số Tổng Thu/Chi hợp nhất
        - name: tax_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc tồn quỹ theo Mã số thuế Doanh nghiệp (bỏ trống để xem hợp nhất toàn tập đoàn)
          example: "0109730501"
        - name: bank_code
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Dữ liệu tồn quỹ hợp nhất hệ thống Tài khoản Ngân hàng (Khối 1 + Khối 2, không tính phần tiền mặt vào quỹ) kèm đủ 5 cột biến động (ĐK, Thu, Chi, CK, Chênh lệch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfoLiquidityResponse'

  /reports/cfo/export-excel:
    get:
      tags:
        - Reports
      summary: Xuất Báo cáo Tồn quỹ Hợp nhất CFO (Khối 1 + Khối 2) ra file Excel (.xlsx) chuẩn mực kế toán
      operationId: exportCfoLiquidityExcel
      parameters:
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [TODAY, YESTERDAY, WTD, MTD, ALL, CUSTOM]
            default: MTD
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: exclude_internal_transfers
          in: query
          schema:
            type: boolean
            default: false
        - name: tax_code
          in: query
          schema:
            type: string
        - name: bank_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File Excel Báo cáo Tồn quỹ Hợp nhất CFO đã sanitize chống Formula Injection
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /reports/ceo/waterfall:
    get:
      tags:
        - Reports
      summary: Báo cáo CEO (Bà Nguyễn Thị Lan Anh) - Biểu đồ Thác nước (Waterfall) Thu/Chi WTD/MTD
      operationId: getCeoWaterfallReport
      parameters:
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
            enum: [WTD, MTD]
            default: MTD
          description: Lũy kế Tuần (WTD) hoặc Lũy kế Tháng (MTD)
        - name: tax_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc báo cáo Waterfall theo Mã số thuế Doanh nghiệp (Multi-Entity)
          example: "0109730501"
      responses:
        '200':
          description: Cấu trúc dữ liệu render biểu đồ Waterfall (đồng bộ SAD & Frontend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterfallReportResponse'

  /reports/export/excel:
    get:
      tags:
        - Reports
      summary: Xuất bảng giao dịch ra file Excel (.xlsx) định dạng kế toán chuẩn mực chống Formula Injection
      operationId: exportTransactionsExcel
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: bank_code
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: tax_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File Excel nhị phân định dạng số tiền #,##0.00 căn phải, ngày DD/MM/YYYY, dòng Tổng cộng và đã sanitize tiền tố Formula
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"Bao_cao_giao_dich_20261029.xlsx\""
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  # ===========================================================================
  # 8. MẪU BÓC TÁCH NGÂN HÀNG (TEMPLATES)
  # ===========================================================================
  /templates:
    get:
      tags:
        - Templates
      summary: Danh sách các mẫu bóc tách và chế độ đối soát của >= 7 ngân hàng thương mại
      operationId: listTemplates
      responses:
        '200':
