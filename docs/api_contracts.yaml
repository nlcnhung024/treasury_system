                $ref: '#/components/schemas/CreditFacilityItem'
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Cập nhật thông tin khoản vay / nợ lẻ
      tags:
        - Credit Statements & Loans
      parameters:
        - name: loan_id
