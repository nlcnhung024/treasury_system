          application/json:
            schema:
              $ref: '#/components/schemas/CreditFacilityUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditFacilityItem'
        '404':
          description: Không tìm thấy khoản vay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Trùng lặp số hợp đồng mới với khoản vay khác
          content:
