openapi: 3.0.3
info:
  title: Bank Statement Processing & Financial Reporting API
  description: >
    Hợp đồng giao tiếp API chuẩn mực phục vụ Hệ thống Xử lý & Báo cáo Sao kê Ngân hàng Tự động (BSP-2026).
    Đặc tả toàn bộ giao tiếp giữa Frontend SPA, API Gateway, Background Worker và hệ thống báo cáo tài chính.
    Tuân thủ nghiêm ngặt chuẩn RESTful, OpenAPI 3.0.3, độ chính xác số học cao (DECIMAL 18,2) và kiến trúc đa tầng phòng vệ (Defense-in-Depth).
    Thiết kế và ban hành bởi Lead System & Data Architect (@SystemArchitect).
  version: 1.2.0
  contact:
    name: System Architecture Team
    email: architect@enterprise.internal

servers:
  - url: /api/v1
    description: Production API Server Gateway

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: Xác thực người dùng, cấp phát token JWT và quản lý phiên làm việc RBAC
  - name: Statements
    description: Tiếp nhận file sao kê đa ngân hàng, bóc tách ngầm và đối soát số dư tự động
  - name: Accounts
    description: Quản lý danh mục tài khoản ngân hàng và tài khoản tiền mặt đặc thù
  - name: Transactions
    description: Quản lý giao dịch, tìm kiếm đa chiều, phân loại thủ công & ghi chú nội bộ
  - name: Cash Ledger
    description: Quản lý sổ quỹ tiền mặt đối ứng và luồng tiền rút từ tài khoản MBBank cá nhân
  - name: Rule Management
    description: Tự quản lý danh mục và thiết lập quy tắc nhận diện từ khóa kết hợp nâng cao
  - name: Reports
    description: Báo cáo CFO (Tồn quỹ tức thì < 9h sáng), Báo cáo CEO (Waterfall chart WTD/MTD) & Xuất Excel an toàn
  - name: Templates
    description: Tra cứu danh mục mẫu sao kê động của các ngân hàng thương mại
  - name: Audit Logs
    description: Truy vết nhật ký kiểm toán bất biến phục vụ an toàn thông tin và kiểm toán kế toán

paths:
  # ===========================================================================
  # 1. XÁC THỰC & PHÂN QUYỀN (AUTHENTICATION & SESSION)
  # ===========================================================================
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập hệ thống và nhận Bearer JWT Token
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công, trả về Access Token, Refresh Token và thông tin phân quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dữ liệu đăng nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Sai tên đăng nhập hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Cấp mới Access Token thông qua Refresh Token xoay vòng (Token Rotation)
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        '200':
          description: Cấp phát Token mới thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: "bearer"
                  expires_in:
                    type: integer
                    example: 900
        '401':
          description: Refresh Token đã hết hạn hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Lấy thông tin tài khoản đang đăng nhập và quyền hạn RBAC
      operationId: getCurrentUser
      responses:
        '200':
          description: Thông tin người dùng hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Chưa xác thực hoặc Token không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ===========================================================================
  # 2. TIẾP NHẬN FILE SAO KÊ & BÓC TÁCH NGẦM (STATEMENTS INGESTION)
  # ===========================================================================
  /statements/upload:
    post:
      tags:
        - Statements
      summary: Tải file sao kê Excel (.xlsx, .xls) vào hệ thống
      operationId: uploadStatementFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File Excel sao kê ngân hàng (.xlsx hoặc .xls, dung lượng tối đa 25MB)
                bank_code:
                  type: string
                  example: "MBB"
                  description: Mã ngân hàng phát hành (MBB, MBV, VPB, TPB, CTG, SHB, VCB, TCB... hoặc để trống để tự nhận diện)
                template_code:
                  type: string
                  example: "MBB_CORP_XLSX"
                  description: Mã cấu hình mẫu sao kê (Tùy chọn - nếu để trống hệ thống tự nhận diện qua Magic Bytes & Signature Rules)
      responses:
        '202':
          description: File đã được tiếp nhận thành công và đẩy vào hàng đợi xử lý ngầm (Accepted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: integer
                    example: 1045
                  file_uuid:
                    type: string
                    format: uuid
                    example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  filename:
                    type: string
                    example: "Bang ket qua giao dich - 111386888 (2).xlsx"
                  detected_template_code:
                    type: string
                    example: "MBB_CORP_XLSX"
                  status:
                    type: string
                    enum: [QUEUED]
                    example: "QUEUED"
                  message:
                    type: string
                    example: "File đã được đưa vào hàng đợi bóc tách ngầm."
        '400':
          description: File không đúng định dạng cho phép (vi phạm Magic Bytes) hoặc vượt quá 25MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: File sao kê trùng lặp hoàn toàn (Trùng mã băm SHA-256)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: File đúng định dạng nhưng không thể nhận diện mẫu ngân hàng hoặc thiếu Header cốt lõi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /statements:
    get:
      tags:
        - Statements
      summary: Lấy danh sách các file sao kê đã tải lên hệ thống
      operationId: listStatementFiles
      parameters:
        - name: bank_code
          in: query
          schema:
            type: string
          example: "MBB"
        - name: processing_status
          in: query
          schema:
            type: string
            enum: [UPLOADED, QUEUED, PARSING, RECONCILING, COMPLETED, FAILED]
        - name: reconciliation_status
          in: query
          schema:
            type: string
            enum: [PENDING, BALANCED, DISCREPANCY]
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách file sao kê phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatementFileItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /statements/{file_id}:
    get:
      tags:
        - Statements
      summary: Lấy thông tin chi tiết một file sao kê kèm kết quả đối soát
      operationId: getStatementDetail
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết file sao kê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementFileDetail'
        '404':
          description: Không tìm thấy file sao kê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Statements
      summary: Hủy hoặc xóa file sao kê và các giao dịch liên quan (chỉ cho phép khi file bị FAILED hoặc DISCREPANCY)
      operationId: deleteStatementFile
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã xóa file và rollback toàn bộ giao dịch liên quan
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id:
                    type: integer
                  message:
                    type: string
                    example: "File và các giao dịch liên quan đã được xóa an toàn."

  /statements/{file_id}/status:
    get:
      tags:
        - Statements
      summary: Kiểm tra tiến trình bóc tách và đối soát của file theo thời gian thực (Polling endpoint)
      operationId: getStatementStatus
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Trạng thái xử lý chi tiết
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementStatusResponse'
        '404':
          description: Không tìm thấy file sao kê
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /statements/{file_id}/events:
    get:
      tags:
        - Statements
      summary: Kết nối Server-Sent Events (SSE) theo dõi luồng bóc tách thời gian thực
      operationId: streamStatementEvents
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Luồng sự kiện SSE phát ra các trạng thái UPLOADED, PARSING (kèm % hoàn thành), RECONCILING, COMPLETED hoặc FAILED
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: progress\ndata: {\"file_id\": 1045, \"status\": \"PARSING\", \"progress\": 75, \"processed_rows\": 750}\n\n"

  /statements/{file_id}/download:
    get:
      tags:
        - Statements
      summary: Lấy Pre-signed URL an toàn (TTL 15 phút) để tải file sao kê gốc từ Object Storage
      operationId: downloadOriginalStatement
      parameters:
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pre-signed URL hợp lệ
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    example: "https://minio.enterprise.internal/statements/MBB/2026/10/3fa85f64.xlsx?X-Amz-Expires=900..."
                  expires_in_seconds:
                    type: integer
                    example: 900

  # ===========================================================================
  # 3. QUẢN LÝ TÀI KHOẢN NGÂN HÀNG & PHÁP NHÂN (ACCOUNTS & MULTI-ENTITY)
  # ===========================================================================
  /accounts:
    get:
      tags:
        - Accounts
      summary: Lấy danh sách tài khoản ngân hàng và tài khoản tiền mặt đặc thù
      operationId: listBankAccounts
      parameters:
        - name: bank_code
          in: query
          schema:
            type: string
          example: "MBB"
        - name: account_type
          in: query
          schema:
            type: string
            enum: [CORPORATE, SPECIAL_CASH]
        - name: tax_code
          in: query
          description: Lọc theo Mã số thuế Doanh nghiệp (Multi-Entity Isolation)
          schema:
            type: string
          example: "0109730501"
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BankAccountItem'
    post:
      tags:
        - Accounts
      summary: Tạo mới cấu hình tài khoản ngân hàng vào hệ thống
      operationId: createBankAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountPayload'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountItem'

  /accounts/{account_id}:
    get:
      tags:
        - Accounts
      summary: Lấy thông tin chi tiết một tài khoản ngân hàng
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountItem'
    patch:
      tags:
        - Accounts
      summary: Cập nhật thông tin tài khoản (số dư khởi tạo, trạng thái kích hoạt)
      parameters:
        - name: account_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bank_name:
                  type: string
                account_holder:
                  type: string
                tax_code:
                  type: string
                opening_balance:
                  type: number
                is_active:
                  type: boolean
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountItem'

  # ===========================================================================
  # 4. TRUY VẤN GIAO DỊCH, PHÂN LOẠI THỦ CÔNG & GHI CHÚ NỘI BỘ (TRANSACTIONS)
  # ===========================================================================
  /transactions:
    get:
      tags:
        - Transactions
      summary: Tìm kiếm và lọc giao dịch đa tiêu chí với Full-Text Search
      operationId: listTransactions
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date
          example: "2026-10-01"
        - name: to_date
          in: query
          schema:
            type: string
            format: date
          example: "2026-10-29"
        - name: bank_code
          in: query
          schema:
            type: string
          example: "MBB"
        - name: account_number
          in: query
          description: Lọc theo số tài khoản cụ thể
          schema:
            type: string
          example: "111386888"
        - name: tax_code
          in: query
          description: Lọc theo Mã số thuế Pháp nhân / Doanh nghiệp (Multi-Entity Filter)
          schema:
            type: string
          example: "0109730501"
        - name: account_holder
          in: query
          description: Lọc theo tên Doanh nghiệp / Chủ tài khoản
          schema:
            type: string
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        - name: category_id
          in: query
          schema:
            type: integer
        - name: flow_type
          in: query
          schema:
            type: string
            enum: [ALL, CREDIT, DEBIT]
          example: "ALL"
        - name: min_amount
          in: query
          schema:
            type: number
        - name: max_amount
          in: query
          schema:
            type: number
        - name: keyword
          in: query
          description: Tìm kiếm toàn văn trong Nội dung giao dịch hoặc Ghi chú nội bộ (GIN Index < 200ms)
          schema:
            type: string
          example: "HOA PHAT"
        - name: is_manual_override
          in: query
          description: Lọc các giao dịch đã bị can thiệp phân loại thủ công
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách giao dịch phân trang
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /transactions/{transaction_id}:
    get:
      tags:
        - Transactions
      summary: Lấy chi tiết một giao dịch
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Transactions
      summary: Cập nhật danh mục thủ công (Inline Tagging) hoặc Ghi chú nội bộ (Internal Note)
      operationId: updateTransaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  nullable: true
                  description: ID danh mục muốn gán bằng tay
                  example: 12
                internal_note:
                  type: string
                  nullable: true
                  description: Ghi chú nội bộ do chị Cẩm Nhung nhập
                  example: "Hóa đơn số 00459 - Chị Lan Anh duyệt miệng"
      responses:
        '200':
          description: Cập nhật thành công, hệ thống tự động gắn cờ is_manual_override = true và ghi nhận Audit Log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItem'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /transactions/bulk-tag:
    post:
      tags:
        - Transactions
      summary: Gán danh mục thủ công hàng loạt cho nhiều dòng giao dịch đã chọn
      operationId: bulkTagTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTagPayload'
      responses:
        '200':
          description: Gán danh mục hàng loạt thành công và kích hoạt khóa bảo vệ chống ghi đè
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTagResponse'

  # ===========================================================================
  # 5. SỔ QUỸ TIỀN MẶT ĐỐI ỨNG (CASH LEDGER)
  # ===========================================================================
  /cash-ledger:
    get:
      tags:
        - Cash Ledger
      summary: Lấy danh sách các bút toán sổ quỹ tiền mặt đối ứng
      operationId: listCashLedgerEntries
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [INFLOW, OUTFLOW]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách bút toán sổ quỹ tiền mặt
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashLedgerItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags:
        - Cash Ledger
      summary: Tạo mới bút toán nhập/xuất quỹ tiền mặt
      operationId: createCashEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashEntryPayload'
      responses:
        '201':
          description: Tạo bút toán tiền mặt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashLedgerItem'

  # ===========================================================================
  # 6. QUẢN LÝ QUY TẮC PHÂN LOẠI & DANH MỤC (SELF-SERVICE RULE BUILDER)
  # ===========================================================================
  /categories:
    get:
      tags:
        - Rule Management
      summary: Lấy danh sách toàn bộ danh mục Thu và Chi
      operationId: listCategories
      parameters:
        - name: category_type
          in: query
          schema:
            type: string
            enum: [INCOME, EXPENSE]
      responses:
        '200':
          description: Danh sách danh mục
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryItem'
    post:
      tags:
        - Rule Management
      summary: Tự tạo mới một danh mục Thu hoặc Chi
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryPayload'
      responses:
        '201':
          description: Tạo danh mục thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItem'

  /categories/{category_id}:
    patch:
      tags:
        - Rule Management
      summary: Cập nhật thông tin danh mục Thu/Chi
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name:
                  type: string
                color_code:
                  type: string
                description:
                  type: string
                display_order:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItem'
    delete:
      tags:
        - Rule Management
      summary: Xóa danh mục Thu/Chi (Các giao dịch liên quan sẽ gán category_id = NULL)
      parameters:
        - name: category_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Xóa danh mục thành công

  /rules:
    get:
      tags:
        - Rule Management
      summary: Lấy danh sách các quy tắc nhận diện từ khóa nâng cao kèm thứ tự ưu tiên
      operationId: listRules
      parameters:
        - name: category_id
          in: query
          schema:
            type: integer
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Danh sách quy tắc phân loại
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuleItem'
    post:
      tags:
        - Rule Management
      summary: Tạo mới quy tắc nhận diện từ khóa kết hợp điều kiện nâng cao
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRulePayload'
      responses:
        '201':
          description: Tạo quy tắc thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleItem'

  /rules/{rule_id}:
    patch:
      tags:
        - Rule Management
      summary: Cập nhật quy tắc phân loại từ khóa nâng cao
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_name:
                  type: string
                category_id:
                  type: integer
                priority:
                  type: integer
                keyword_patterns:
                  type: string
                match_type:
                  type: string
                  enum: [CONTAINS, EXACT, REGEX]
                target_bank_code:
                  type: string
                  nullable: true
                target_account_number:
                  type: string
                  nullable: true
                min_amount:
                  type: number
                  nullable: true
                max_amount:
                  type: number
                  nullable: true
                applies_to_flow:
                  type: string
                  enum: [ALL, CREDIT, DEBIT]
                is_active:
                  type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleItem'
    delete:
      tags:
        - Rule Management
      summary: Xóa một quy tắc
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Đã xóa quy tắc thành công

  /rules/re-apply:
    post:
      tags:
        - Rule Management
      summary: Chạy lại toàn bộ bộ quy tắc lên dữ liệu lịch sử (Bảo vệ tuyệt đối dòng is_manual_override = true)
      operationId: reapplyRules
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from_date:
                  type: string
                  format: date
                to_date:
                  type: string
                  format: date
                bank_code:
                  type: string
      responses:
        '200':
          description: Kết quả chạy lại quy tắc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReapplyRulesResponse'

  # ===========================================================================
  # 7. PHÂN HỆ BÁO CÁO (CFO, CEO & AN TOÀN XUẤT EXCEL)
  # ===========================================================================
  /reports/cfo/daily-liquidity:
    get:
      tags:
        - Reports
      summary: Báo cáo CFO (Ông Trần Ngọc Tuấn) - Tổng tồn quỹ hợp nhất đầu ngày (< 9h00 sáng)
      operationId: getCfoDailyLiquidity
      parameters:
        - name: tax_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc tồn quỹ theo Mã số thuế Doanh nghiệp (bỏ trống để xem hợp nhất toàn tập đoàn)
          example: "0109730501"
      responses:
        '200':
          description: Dữ liệu tồn quỹ hợp nhất sẵn sàng trước 9h00 sáng (SLA truy vấn <= 100ms)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfoLiquidityResponse'

  /reports/ceo/waterfall:
    get:
      tags:
        - Reports
      summary: Báo cáo CEO (Bà Nguyễn Thị Lan Anh) - Biểu đồ Thác nước (Waterfall) Thu/Chi WTD/MTD
      operationId: getCeoWaterfallReport
      parameters:
        - name: timeframe
          in: query
          required: true
          schema:
            type: string
            enum: [WTD, MTD]
            default: MTD
          description: Lũy kế Tuần (WTD) hoặc Lũy kế Tháng (MTD)
        - name: tax_code
          in: query
          required: false
          schema:
            type: string
          description: Lọc báo cáo Waterfall theo Mã số thuế Doanh nghiệp (Multi-Entity)
          example: "0109730501"
      responses:
        '200':
          description: Cấu trúc dữ liệu render biểu đồ Waterfall (đồng bộ SAD & Frontend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaterfallReportResponse'

  /reports/export/excel:
    get:
      tags:
        - Reports
      summary: Xuất bảng giao dịch ra file Excel (.xlsx) định dạng kế toán chuẩn mực chống Formula Injection
      operationId: exportTransactionsExcel
      parameters:
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: bank_code
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: integer
        - name: tax_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: File Excel nhị phân định dạng số tiền #,##0.00 căn phải, ngày DD/MM/YYYY, dòng Tổng cộng và đã sanitize tiền tố Formula
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"Bao_cao_giao_dich_20261029.xlsx\""
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  # ===========================================================================
  # 8. MẪU BÓC TÁCH NGÂN HÀNG (TEMPLATES)
  # ===========================================================================
  /templates:
    get:
      tags:
        - Templates
      summary: Danh sách các mẫu bóc tách và chế độ đối soát của >= 7 ngân hàng thương mại
      operationId: listTemplates
      responses:
        '200':
          description: Danh sách cấu hình mẫu bóc tách động
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateInfoItem'

  # ===========================================================================
  # 9. NHẬT KÝ KIỂM TOÁN AN NINH (AUDIT LOGS)
  # ===========================================================================
  /audit-logs:
    get:
      tags:
        - Audit Logs
      summary: Truy vấn nhật ký kiểm toán hệ thống bất biến (Audit Trail)
      operationId: listAuditLogs
      parameters:
        - name: correlation_id
          in: query
          schema:
            type: string
            format: uuid
        - name: actor
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
            example: "MANUAL_TAG"
        - name: target_entity
          in: query
          schema:
            type: string
            example: "TRANSACTION"
        - name: from_date
          in: query
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Danh sách bản ghi kiểm toán
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogItem'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

# =============================================================================
# THÀNH PHẦN TÁI SỬ DỤNG (COMPONENTS & SCHEMAS)
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JSON Web Token (JWT) được cấp sau khi đăng nhập thành công.

    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key bảo mật dùng riêng cho Background Worker và giao tiếp giữa các vi dịch vụ nội bộ.

  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: "nhung.nghiem@enterprise.internal"
        password:
          type: string
          format: password
          example: "P@ssw0rdSecure2026!"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        token_type:
          type: string
          example: "bearer"
        expires_in:
          type: integer
          example: 900
          description: Thời hạn hiệu lực của Access Token (15 phút)
        refresh_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/UserProfileResponse'

    UserProfileResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 101
        username:
          type: string
          example: "nhung.nghiem"
        full_name:
          type: string
          example: "Nghiêm Lê Cẩm Nhung"
        role:
          type: string
          enum: [ACCOUNTANT, CFO, CEO, SYSTEM_ADMIN]
          example: "ACCOUNTANT"
        allowed_tax_codes:
          type: array
          items:
            type: string
          example: ["0109730501", "0109888999"]
          description: Danh sách Mã số thuế Pháp nhân mà người dùng được phân quyền truy cập

    BankAccountItem:
      type: object
      properties:
        account_id:
          type: integer
          example: 1
        bank_code:
          type: string
          example: "MBB"
        bank_name:
          type: string
          example: "Ngân hàng TMCP Quân Đội"
        account_number:
          type: string
          example: "111386888"
        account_holder:
          type: string
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        tax_code:
          type: string
          example: "0109730501"
        account_type:
          type: string
          enum: [CORPORATE, SPECIAL_CASH]
          example: "CORPORATE"
        currency:
          type: string
          example: "VND"
        opening_balance:
          type: number
          example: 0.00
        current_balance:
          type: number
          example: 147097279.00
        is_active:
          type: boolean
          example: true

    CreateAccountPayload:
      type: object
      required:
        - bank_code
        - bank_name
        - account_number
        - account_holder
      properties:
        bank_code:
          type: string
          example: "MBB"
        bank_name:
          type: string
          example: "Ngân hàng TMCP Quân Đội"
        account_number:
          type: string
          example: "111386888"
        account_holder:
          type: string
          example: "CONG TY CO PHAN XI MANG SUNRISE"
        tax_code:
          type: string
          example: "0109730501"
